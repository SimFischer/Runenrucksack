<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Runenrucksack</title>
  <meta name="description" content="Ein Fantasy-Backpack-Battler fürs iPad.">
  <meta name="theme-color" content="#2b1d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Runenrucksack">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="schrift/schrift.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="gestaltung.css">
</head>
<body>
  <!-- Startbildschirm: Das Titelbild ist der Bildschirm, darauf nur Schriftzug, Untertitel und wenige große Knöpfe -->
  <section id="start" class="screen">
    <img class="start-bild" src="assets/titelbild.webp" alt="" onerror="this.remove()">
    <div class="start-mitte">
      <h1 class="logo-schrift">Runenrucksack</h1>
      <p class="start-unter">Packe deinen Rucksack und rette die Wörter der Wanderlande.</p>
      <!-- Erst fragen: Mehrere Kinder teilen sich oft ein iPad. -->
      <div class="start-ask" id="start-ask">
        <button id="btn-first" class="btn big primary">Ich bin zum ersten Mal hier</button>
        <button id="btn-known" class="btn big">Ich kenne das schon</button>
      </div>
      <div class="start-menu" id="start-menu" hidden>
        <div class="start-haupt">
          <button id="btn-continue" class="btn big primary" hidden>Weiterspielen</button>
          <button id="btn-new" class="btn big">Neuer Lauf</button>
        </div>
        <div class="start-rang" id="start-rang"></div>
        <div class="start-runde">
          <button id="btn-code-ein" class="symbolknopf"><span class="btn rund"><img class="sym" src="assets/ui/symbole/schloss.webp" alt=""></span><small>Heldencode</small></button>
          <button id="btn-buch" class="symbolknopf"><span class="btn rund"><img class="sym" src="assets/ui/symbole/buch.webp" alt=""></span><small>Buch</small></button>
          <button id="btn-sammlung" class="symbolknopf"><span class="btn rund"><img class="sym" src="assets/ui/symbole/pokal.webp" alt=""></span><small>Sammlung</small></button>
          <button id="btn-tutorial" class="symbolknopf"><span class="btn rund"><img class="sym" src="assets/ui/symbole/stern.webp" alt=""></span><small>Tutorial</small></button>
          <button id="btn-help" class="symbolknopf"><span class="btn rund"><img class="sym" src="assets/ui/symbole/menue.webp" alt=""></span><small>So geht's</small></button>
          <button id="btn-lehrkraft" class="symbolknopf"><span class="btn rund"><img class="sym" src="assets/ui/symbole/eule.webp" alt=""></span><small>Lehrkraft</small></button>
        </div>
        <button id="btn-neu-beginnen" class="btn small quick-no">Neu beginnen …</button>
      </div>
    </div>
  </section>

  <!-- Figurenwahl -->
  <section id="heroes" class="screen" hidden>
    <div class="heroes-wrap">
      <h1 class="titel-gross figuren-titel">Wähle deine Figur</h1>
      <div class="figur-reihe" id="hero-cards"></div>
      <div class="figur-detail tafel" id="figur-detail" hidden></div>
    </div>
  </section>

  <!-- Tag: Laden und Rucksack -->
  <section id="game" class="screen" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-text">Runenrucksack</span></div>
      <div class="stat" id="stat-hero"></div>
      <div class="stat" id="stat-day"></div>
      <div class="stat" id="stat-hearts" data-tut="herzen"></div>
      <div class="stat" id="stat-wins" data-tut="siege"></div>
      <div class="stat gold" id="stat-gold" data-tut="gold" aria-label="Gold"><span class="coin"><img class="sym" src="assets/ui/symbole/gold.webp" alt=""></span><span class="gold-num" id="gold-num">0</span></div>
      <div class="spacer"></div>
      <button id="btn-buch-spiel" class="btn icon" aria-label="Buch der Wörter" data-tut="buch"><img class="sym" src="assets/ui/symbole/buch.webp" alt=""></button>
      <button id="btn-menu" class="btn icon" aria-label="Menü" data-tut="menue"><img class="sym" src="assets/ui/symbole/menue.webp" alt=""></button>
      <button id="btn-fight" class="btn primary fight" data-tut="kampf"><img class="sym" src="assets/ui/symbole/kampf.webp" alt=""> Zum Kampf</button>
    </header>

    <main class="board">
      <section class="panel bag-panel" data-tut="rucksack">
        <h2>Rucksack</h2>
        <div class="grid" id="grid-bag" data-area="bag"></div>
      </section>
      <section class="panel store-panel" data-tut="lager">
        <h2>Lager <span class="hint">wirkt nicht im Kampf</span></h2>
        <div class="grid store" id="grid-store" data-area="store"></div>
      </section>
      <aside class="panel info-panel" id="info" data-tut="info"></aside>
      <section class="panel shop-panel" id="shop" data-tut="laden">
        <div class="shop-head">
          <h2>Laden</h2>
          <span class="shop-gold" id="shop-gold" data-tut="ladengold"><img class="sym" src="assets/ui/symbole/gold.webp" alt=""> <b id="shop-gold-num">0</b></span>
          <button id="btn-reroll" class="btn"><img class="sym" src="assets/ui/symbole/wuerfel.webp" alt=""> Neu würfeln <span class="price">1 <img class="sym klein" src="assets/ui/symbole/gold.webp" alt=""></span></button>
        </div>
        <div class="shop-slots" id="shop-slots"></div>
        <div class="sell-hint">Hierher ziehen zum Verkaufen</div>
      </section>
    </main>
  </section>

  <!-- Nacht: Kampf -->
  <section id="battle" class="screen" hidden>
    <header class="topbar">
      <div class="brand" id="battle-title">Nacht</div>
      <div class="stat" id="battle-time">0,0 s</div>
      <div class="stat gold" id="battle-gold"></div>
      <div class="spacer"></div>
      <div class="speed" id="speed" data-tut="tempo">
        <button class="btn" data-speed="1">1×</button>
        <button class="btn" data-speed="2">2×</button>
        <button class="btn" data-speed="4">4×</button>
      </div>
      <button id="btn-skip" class="btn small">Überspringen</button>
    </header>
    <main class="arena">
      <div class="fighter" id="fighter-player" data-tut="kampf-rucksack"></div>
      <div class="versus">
        <div class="vs">VS</div>
        <button id="btn-start-battle" class="btn big primary">Los!</button>
      </div>
      <div class="fighter" id="fighter-enemy" data-tut="kampf-gegner"></div>
    </main>
  </section>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" id="modal-card" data-tut="fenster"></div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <div id="rotate-hint" class="rotate-hint">
    <img class="sym gross" src="assets/ui/symbole/karte.webp" alt="">
    <p class="titel">Bitte dreh dein iPad</p>
    <p>Runenrucksack spielt man im Querformat.</p>
  </div>

  <script src="js/vendor/qrcode.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
